<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Consolas', monospace; }
    </style>
  </defs>
  <rect width="1000" height="560" rx="12" fill="#0d1117"/>
  <rect x="0" y="0" width="1000" height="40" rx="12" fill="#161b22"/>
  <rect x="0" y="28" width="1000" height="12" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="20" r="6" fill="#27c93f"/>
  <text x="500" y="25" text-anchor="middle" class="mono" font-size="13" fill="#8b949e">codebase-agent — python agent.py</text>

  <text x="24" y="80" class="mono" font-size="14" fill="#58a6ff" font-weight="600">You: </text>
  <text x="70" y="80" class="mono" font-size="14" fill="#c9d1d9">find all TODO comments in the code</text>

  <text x="24" y="110" class="mono" font-size="13" fill="#e3b341">→ tool: grep_exact('TODO')</text>
  <text x="24" y="130" class="mono" font-size="12" fill="#6e7681">scope: interview-mocker</text>

  <rect x="24" y="155" width="952" height="80" rx="8" fill="none" stroke="#3fb950" stroke-width="1.5"/>
  <text x="500" y="180" text-anchor="middle" class="mono" font-size="13" font-weight="600" fill="#3fb950">Agent</text>
  <line x1="24" y1="190" x2="976" y2="190" stroke="#21262d" stroke-width="1"/>
  <text x="50" y="215" class="mono" font-size="13" fill="#c9d1d9">No TODO comments were found in the code.</text>

  <text x="24" y="270" class="mono" font-size="14" fill="#58a6ff" font-weight="600">You: </text>
  <text x="70" y="270" class="mono" font-size="14" fill="#c9d1d9">how does the AI generate feedback?</text>

  <text x="24" y="300" class="mono" font-size="13" fill="#e3b341">→ tool: search_codebase('Feedback generation')</text>
  <text x="24" y="320" class="mono" font-size="12" fill="#6e7681">scope: interview-mocker</text>
  <text x="24" y="340" class="mono" font-size="12" fill="#6e7681">sources: app/how-it-works/page.jsx, RecordAnswerSection.jsx, app/questions/page.jsx</text>

  <rect x="24" y="365" width="952" height="130" rx="8" fill="none" stroke="#3fb950" stroke-width="1.5"/>
  <text x="500" y="390" text-anchor="middle" class="mono" font-size="13" font-weight="600" fill="#3fb950">Agent</text>
  <line x1="24" y1="400" x2="976" y2="400" stroke="#21262d" stroke-width="1"/>
  <text x="50" y="425" class="mono" font-size="13" fill="#c9d1d9">The AI generates feedback by recording spoken or typed responses, comparing</text>
  <text x="50" y="450" class="mono" font-size="13" fill="#c9d1d9">them against a job description and an ideal answer generated by Gemini AI.</text>
  <text x="50" y="475" class="mono" font-size="13" fill="#c9d1d9">It reviews completeness, technical vocabulary, and clarity to issue a rating.</text>

  <text x="24" y="530" class="mono" font-size="12" fill="#8b949e">Three tools available: search_codebase (semantic) · grep_exact (keyword) · list_files (structure)</text>
</svg>
