<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Consolas', monospace; }
    </style>
  </defs>
  <rect width="1000" height="560" rx="12" fill="#0d1117"/>
  <rect x="0" y="0" width="1000" height="40" rx="12" fill="#161b22"/>
  <rect x="0" y="28" width="1000" height="12" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="20" r="6" fill="#27c93f"/>
  <text x="500" y="25" text-anchor="middle" class="mono" font-size="13" fill="#8b949e">codebase-agent — python agent.py</text>

  <text x="24" y="75" class="mono" font-size="14" fill="#58a6ff" font-weight="600">You: </text>
  <text x="70" y="75" class="mono" font-size="14" fill="#c9d1d9">what is the purpose of this project</text>

  <rect x="24" y="95" width="952" height="55" rx="8" fill="none" stroke="#3fb950" stroke-width="1.5"/>
  <text x="50" y="115" class="mono" font-size="12" fill="#3fb950" font-weight="600">Agent</text>
  <text x="50" y="135" class="mono" font-size="12" fill="#c9d1d9">An AI-based interview preparation platform with mock interviews and feedback...</text>

  <text x="24" y="185" class="mono" font-size="14" fill="#58a6ff" font-weight="600">You: </text>
  <text x="70" y="185" class="mono" font-size="14" fill="#c9d1d9">which file handles that?</text>
  <text x="240" y="185" class="mono" font-size="12" fill="#6e7681" font-style="italic">(follow-up — no repeated context)</text>

  <text x="24" y="215" class="mono" font-size="13" fill="#e3b341">→ tool: grep_exact('handle_that')</text>
  <text x="24" y="235" class="mono" font-size="12" fill="#6e7681">scope: interview-mocker  ·  history passed into router for pronoun resolution</text>

  <rect x="24" y="260" width="952" height="90" rx="8" fill="none" stroke="#3fb950" stroke-width="1.5"/>
  <text x="500" y="285" text-anchor="middle" class="mono" font-size="13" font-weight="600" fill="#3fb950">Agent</text>
  <line x1="24" y1="295" x2="976" y2="295" stroke="#21262d" stroke-width="1"/>
  <text x="50" y="320" class="mono" font-size="13" fill="#c9d1d9">I'm sorry, but I cannot determine which file handles "handle_that" without</text>
  <text x="50" y="340" class="mono" font-size="13" fill="#c9d1d9">more context. Could you clarify what you're referring to?</text>

  <rect x="24" y="375" width="952" height="120" rx="8" fill="none" stroke="#e3b341" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="50" y="400" class="mono" font-size="12" font-weight="600" fill="#e3b341">Known limitation — documented in README</text>
  <text x="50" y="425" class="mono" font-size="12" fill="#8b949e">A 1.5B-parameter local model struggles to resolve pronouns in follow-up</text>
  <text x="50" y="447" class="mono" font-size="12" fill="#8b949e">questions into concrete search terms. Passing history into the router turned</text>
  <text x="50" y="469" class="mono" font-size="12" fill="#8b949e">a confidently wrong answer into an honestly uncertain one — genuine progress,</text>
  <text x="50" y="491" class="mono" font-size="12" fill="#8b949e">even if not a full fix.</text>
</svg>
